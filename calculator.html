<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Прибуток</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#f5f5f7;--card:#fff;--ink:#1d1d1f;--mut:#6e6e73;--line:#e5e5ea;--blue:#0071e3;--pos:#248a3d;--fill:#ececf0;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--card:#1c1c1e;--ink:#f5f5f7;--mut:#98989d;--line:#38383a;--blue:#2997ff;--pos:#30d158;--fill:#2c2c2e;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#000;--card:#1c1c1e;--ink:#f5f5f7;--mut:#98989d;--line:#38383a;--blue:#2997ff;--pos:#30d158;--fill:#2c2c2e;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter",system-ui,sans-serif;line-height:1.4;-webkit-font-smoothing:antialiased}
main{max-width:680px;margin:0 auto;padding:32px 16px 56px}
h1{font-size:clamp(2rem,8vw,2.8rem);font-weight:700;letter-spacing:-.025em;margin:0 0 16px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:2px 0 14px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;border:0;border-radius:980px;padding:8px 16px;font:inherit;font-size:.92rem;font-weight:500;background:var(--fill);color:var(--ink);cursor:pointer;min-height:36px}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.hero{background:var(--card);border-radius:22px;padding:26px 22px;margin:4px 0 8px}
.hero p{margin:0;color:var(--mut);font-size:.95rem;font-weight:500}
.hero strong{display:block;font-size:clamp(2.6rem,12vw,4rem);font-weight:700;letter-spacing:-.035em;line-height:1.08;font-variant-numeric:tabular-nums}
.hero span{color:var(--mut);font-size:.92rem}
h3{font-size:.85rem;font-weight:500;color:var(--mut);margin:22px 14px 8px}
.grp{background:var(--card);border-radius:16px;overflow:hidden}
.r{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;min-height:52px;border-top:1px solid var(--line);width:100%;font:inherit;color:inherit;text-align:left;background:none;border-left:0;border-right:0;border-bottom:0}
.r:first-child{border-top:0}
button.r{cursor:pointer}
.l b{display:block;font-weight:500;font-size:1rem}
.l small{color:var(--mut);font-size:.82rem}
.v{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
.v.pos{color:var(--pos)}
.v.neg{color:var(--mut)}
.in{width:96px;font:inherit;font-weight:600;font-size:1.05rem;text-align:right;color:var(--blue);background:var(--fill);border:0;border-radius:10px;padding:8px 10px;min-height:40px}
details{margin-top:26px}
summary{cursor:pointer;color:var(--blue);font-weight:500;padding:6px 14px}
.set .in{color:var(--ink)}
footer{color:var(--mut);font-size:.8rem;margin:18px 14px 0}
</style>
</head>
<body>
<main>
<h1>Прибуток 2026</h1>
<nav class="tabs" id="tabs" aria-label="Період"></nav>
<div id="view"></div>
<details>
<summary>Ставки та налаштування</summary>
<div class="grp set" id="set" style="margin-top:8px"></div>
</details>
<footer>Податки (ПДФО та військовий збір) утримуються з доходу до реінвестування. Залишок, якого не вистачає на сертифікат, переходить на наступний місяць. Курс USD вкажіть актуальний.</footer>
</main>
<script>
(function(){
var MN=["Січень","Лютий","Березень","Квітень","Травень","Червень","Липень","Серпень","Вересень","Жовтень","Листопад","Грудень"];
var K="profit-2026",$=function(i){return document.getElementById(i)};
var DEF={r1:500,r2:100,r3:200,r4:0.4,tp:18,tv:5,cp:11.65,y:9.5,fx:44};
var FL=[["r1","ПУМБ, ₴ за людину"],["r2","Монобанк, ₴ за людину"],["r3","Inzhur, ₴ за людину"],["r4","ОВДП, ₴ на день за 1 шт."],["tp","ПДФО, %"],["tv","Військовий збір, %"],["cp","Ціна сертифіката Inzhur, ₴"],["y","Дохідність Inzhur, % річних (USD)"],["fx","Курс USD, ₴"]];
var S=Object.assign({},DEF),D=[],i;
for(i=0;i<12;i++)D.push({a:0,b:0,c:0,p:0});
try{var sv=JSON.parse(localStorage.getItem(K)||"null");if(sv){Object.assign(S,sv.S);if(sv.D)D=sv.D}}catch(e){}
function save(){try{localStorage.setItem(K,JSON.stringify({S:S,D:D}))}catch(e){}}
var nf=new Intl.NumberFormat("uk-UA",{maximumFractionDigits:2});
var M=function(v){return nf.format(v)+" ₴"},U=function(v){return nf.format(v)+" $"};
var N=function(v){v=parseFloat(v);return isFinite(v)&&v>0?v:0};
var view=new Date().getFullYear()===2026?new Date().getMonth():0;
function dim(m){return new Date(2026,m+1,0).getDate()}
function calc(){
  var rows=[],carry=0,t={g:0,pd:0,vz:0,n:0,c:0,inv:0};
  for(var m=0;m<12;m++){
    var d=D[m],g=d.a*S.r1+d.b*S.r2+d.c*S.r3+d.p*dim(m)*S.r4;
    var pd=g*S.tp/100,vz=g*S.tv/100,n=g-pd-vz,pool=carry+n;
    var cnt=S.cp>0?Math.floor(pool/S.cp+1e-9):0,inv=cnt*S.cp;carry=pool-inv;
    t.g+=g;t.pd+=pd;t.vz+=vz;t.n+=n;t.c+=cnt;t.inv+=inv;
    rows.push({g:g,pd:pd,vz:vz,n:n,cnt:cnt,inv:inv,rest:carry,cum:t.c});
  }
  t.rest=carry;return{rows:rows,t:t};
}
function row(l,s,v,cls){return '<div class="r"><div class="l"><b>'+l+'</b>'+(s?'<small>'+s+'</small>':'')+'</div><div class="v '+(cls||'')+'">'+v+'</div></div>'}
function inp(k,l,s,sid){return '<label class="r"><span class="l"><b>'+l+'</b><small id="'+sid+'">'+s+'</small></span><input class="in" data-k="'+k+'" type="number" min="0" step="1" inputmode="numeric" value="'+(D[view][k]||"")+'" placeholder="0"></label>'}
function tabs(){
  var h="";for(var m=0;m<12;m++)h+='<button data-v="'+m+'" aria-pressed="'+(view===m)+'">'+MN[m].slice(0,3)+'</button>';
  h+='<button data-v="12" aria-pressed="'+(view===12)+'">Рік</button>';$("tabs").innerHTML=h;
}
function build(){
  tabs();var v=$("view");
  if(view<12){
    v.innerHTML='<section class="hero"><p>Чистий прибуток · '+MN[view]+'</p><strong id="net"></strong><span id="hs"></span></section>'+
    '<h3>Залучено за місяць</h3><div class="grp">'+inp("a","ПУМБ","","s1")+inp("b","Монобанк","","s2")+inp("c","Inzhur","","s3")+inp("p","ОВДП, шт.","","s4")+'</div>'+
    '<h3>Податки</h3><div class="grp" id="tx"></div><h3>Реінвестування в Inzhur</h3><div class="grp" id="rv"></div>';
  }else v.innerHTML="";
  paint();
}
function persp(usd){
  var P=[["1 місяць",1],["3 місяці",3],["6 місяців",6],["1 рік",12],["2 роки",24],["3 роки",36],["5 років",60]],r=S.y/1200;
  var h='<h3>Перспектива доходу від вкладень</h3><div class="grp">';
  P.forEach(function(p){var s=usd*r*p[1],c=usd*(Math.pow(1+r,p[1])-1);
    h+=row(p[0],"з реінвестуванням доходу: "+M(c*S.fx)+" ("+U(c)+")",M(s*S.fx),"pos")});
  return h+'</div><p style="color:var(--mut);font-size:.8rem;margin:10px 14px 0">Праворуч — дохід без реінвестування, під ним — з щомісячним реінвестуванням. База: усі вкладення за рік ('+M(usd*S.fx)+'). Нових внесків, зміни курсу й ставки немає, податки на дохід Inzhur не враховано.</p>';
}
function paint(){
  var c=calc();
  if(view<12){
    var r=c.rows[view];
    $("net").textContent=M(r.n);$("hs").textContent="Дохід до податків "+M(r.g);
    $("s1").textContent=nf.format(S.r1)+" ₴ за людину";$("s2").textContent=nf.format(S.r2)+" ₴ за людину";
    $("s3").textContent=nf.format(S.r3)+" ₴ за людину (20 сертифікатів)";$("s4").textContent=nf.format(S.r4)+" ₴ × "+dim(view)+" дн. за шт.";
    $("tx").innerHTML=row("Дохід до податків","",M(r.g))+row("ПДФО "+S.tp+"%","",'−'+M(r.pd),"neg")+row("Військовий збір "+S.tv+"%","",'−'+M(r.vz),"neg")+row("Чистий прибуток","",M(r.n),"pos");
    $("rv").innerHTML=row("Куплено сертифікатів","по "+nf.format(S.cp)+" ₴",nf.format(r.cnt))+row("Вкладено","",M(r.inv))+row("Залишок на наступний місяць","",M(r.rest))+row("Усього сертифікатів з початку року","",nf.format(r.cum));
  }else{
    var t=c.t,h='<section class="hero"><p>Чистий прибуток за рік</p><strong>'+M(t.n)+'</strong><span>Дохід до податків '+M(t.g)+'</span></section><h3>По місяцях</h3><div class="grp">';
    for(var m=0;m<12;m++)h+='<button class="r" data-v="'+m+'"><span class="l"><b>'+MN[m]+'</b><small>до податків '+M(c.rows[m].g)+'</small></span><span class="v pos">'+M(c.rows[m].n)+'</span></button>';
    var usd=S.fx>0?t.inv/S.fx:0,ya=usd*S.y/100;
    h+='</div><h3>Податки за рік</h3><div class="grp">'+row("ПДФО "+S.tp+"%","",'−'+M(t.pd),"neg")+row("Військовий збір "+S.tv+"%","",'−'+M(t.vz),"neg")+row("Разом податків","",'−'+M(t.pd+t.vz),"neg")+'</div>'+
    '<h3>Реінвестування в Inzhur</h3><div class="grp">'+row("Сертифікатів куплено","",nf.format(t.c))+row("Вкладено","≈ "+U(usd),M(t.inv))+row("Залишок","",M(t.rest))+row("Дохід на рік від вкладень ("+nf.format(S.y)+"%)","у гривнях за курсом "+nf.format(S.fx),U(ya),"pos")+row("","",M(ya*S.fx),"pos")+'</div>'+persp(usd);
    $("view").innerHTML=h;
  }
}
document.addEventListener("click",function(e){
  var b=e.target.closest("[data-v]");if(!b)return;
  view=+b.dataset.v;build();window.scrollTo(0,0);
});
$("view").addEventListener("input",function(e){
  var k=e.target.dataset.k;if(!k)return;
  D[view][k]=N(e.target.value);save();paint();
});
var sh="";FL.forEach(function(f){sh+='<label class="r"><span class="l"><b>'+f[1]+'</b></span><input class="in" data-s="'+f[0]+'" type="number" min="0" step="any" inputmode="decimal" value="'+S[f[0]]+'"></label>'});
$("set").innerHTML=sh;
$("set").addEventListener("input",function(e){
  var k=e.target.dataset.s;if(!k)return;
  S[k]=N(e.target.value);save();paint();
});
build();
})();
</script>
</body>
</html>
